services:
  # ---- Frontend (Nginx + React SPA) ----
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: askmynotes-client
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ---- Backend API (Express) ----
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: askmynotes-backend
    env_file:
      - ./server/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # ---- BullMQ Workers ----
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: askmynotes-worker
    command: ["node", "-r", "dotenv/config", "src/workers/index.js"]
    env_file:
      - ./server/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # ---- Redis (for BullMQ) ----
  redis:
    image: redis:7-alpine
    container_name: askmynotes-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
